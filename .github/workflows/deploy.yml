name: Deploy a producción (subdominio Galvi)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Armar carpeta de despliegue (misma estructura que la raíz FTP)
        run: |
          mkdir -p deploy_root/administracion.galvi.es
          mkdir -p deploy_root/backend
          cp -r public/. deploy_root/administracion.galvi.es/
          cp -r frontend/dist/. deploy_root/administracion.galvi.es/
          cp -r backend/. deploy_root/backend/

      - name: Deploy por FTP (una sola conexión)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy_root/
          server-dir: ./
          log-level: verbose
