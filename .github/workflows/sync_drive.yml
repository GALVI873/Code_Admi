name: Sincronizar Drive (programado)

# Actualiza automáticamente las bases del panel (Presupuestos en Estudio,
# ofertas de proveedor, Obras Aceptadas, Diario General) todos los días
# antes de que empiece la jornada, sin depender de que alguien lo corra a
# mano desde su computadora. Todos los scripts leen Drive por su API
# (OAuth), no por el mount Z:\ de Drive Desktop, así que pueden correr en un
# runner de GitHub sin ningún acceso especial a ninguna máquina — poppler-
# utils/tesseract (para OCR de PDF escaneados) se instalan solos con
# apt-get, son paquetes estándar de Ubuntu.
#
# 05:00 UTC = 6:00 (CET, invierno) u 7:00 (CEST, verano) hora de Madrid —
# ajustar el cron si se necesita otro horario.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/drive_sync
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_ENVIADOS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ENVIADOS_FOLDER_ID }}
      GOOGLE_DRIVE_OBRAS_ACEPTADAS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OBRAS_ACEPTADAS_FOLDER_ID }}
      GOOGLE_DRIVE_DIARIO_GENERAL_FILE_ID: ${{ secrets.GOOGLE_DRIVE_DIARIO_GENERAL_FILE_ID }}
      GOOGLE_DRIVE_PAF_FILE_ID: ${{ secrets.GOOGLE_DRIVE_PAF_FILE_ID }}
      PANEL_API_URL: ${{ secrets.PANEL_API_URL }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      # poppler-utils (pdftoppm) y tesseract-ocr (con el paquete de idioma
      # español): solo los usa "Sincronizar ofertas de proveedor" para leer
      # por OCR los PDF de oferta que vienen escaneados (sin texto real) —
      # ver el comentario de cabecera de sync_ofertas_proveedor.js. Paquetes
      # livianos de Ubuntu, no requieren nada especial del runner.
      - name: Instalar OCR (poppler-utils + tesseract)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa

      # continue-on-error en cada paso: que falle una sincronización (ej. un
      # Excel raro, la API de Drive lenta un rato) no debe impedir que las
      # otras dos igual actualicen el panel.
      - name: Sincronizar Presupuestos en Estudio
        run: node sync_all.js
        continue-on-error: true

      # Ofertas de proveedor detectadas en la carpeta "Valoración" de cada
      # obra — antes era manual (extraer_ofertas_proveedor.js, necesitaba el
      # mount Z:\ de Drive Desktop, nadie lo corría con regularidad). Va
      # después de "Sincronizar Presupuestos en Estudio" porque empareja
      # contra las solicitudes que ya estén cargadas en el panel.
      - name: Sincronizar ofertas de proveedor
        run: node sync_ofertas_proveedor.js
        continue-on-error: true

      # Antes de sincronizar Obras Aceptadas: mueve la carpeta de cualquier
      # obra recién marcada "Aceptado" desde el panel — así, si hubo un
      # traspaso, la sincronización de abajo ya la encuentra en su carpeta
      # nueva en esta misma corrida. --aplicar (a diferencia de correrlo a
      # mano, que por defecto solo simula) porque acá sí queremos que se
      # ejecute solo, sin que nadie lo revise antes.
      - name: Traspasar obras recién aceptadas
        run: node traspasar_obras_aceptadas.js --aplicar
        continue-on-error: true

      - name: Sincronizar Obras Aceptadas
        run: node sync_obras_aceptadas.js
        continue-on-error: true

      # Costo real por obra desde PAF.xlsx, para la vista de Costes (solo
      # admin) — va después de "Sincronizar Obras Aceptadas" porque necesita
      # la lista de obras aceptadas ya actualizada para emparejar contra
      # ella (ver sync_costes_paf.js).
      - name: Sincronizar costes reales (PAF)
        run: node sync_costes_paf.js
        continue-on-error: true

      - name: Sincronizar Diario General
        run: node sync_diario_general.js
        continue-on-error: true

      # Botón "Enviar medidas" en Planos: arma el Excel de medidas
      # confirmadas y lo sube a la carpeta "medición" de la obra — no edita
      # ningún Excel existente, así que puede correr acá (a diferencia de
      # escribir_confirmaciones_aceptadas.js / escribir_ubicacion_diario_general.js).
      - name: Enviar medidas confirmadas al taller
        run: node enviar_medidas_taller.js
        continue-on-error: true

      # PDF de un adicional de obra ya "Aceptado" por el cliente, cargado a
      # mano por Geraldinne desde el panel — se sube a la carpeta
      # "1.Organización/Adicionales" de esa obra (ver adicionales_obra.php).
      - name: Enviar PDFs de adicionales aceptados
        run: node enviar_adicionales_aceptados.js
        continue-on-error: true
